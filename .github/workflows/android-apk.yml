name: Build Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build Web Application
        run: npm run build:android

      - name: Grant execute permission for Gradlew
        run: chmod +x android/gradlew

      - name: Build Android Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Validate APK Existence & Size
        run: |
          echo "Locating generated Android Release APK..."
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" -type f | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::Release APK not found in android/app/build/outputs/apk/release!"
            echo "Checking android/app/build/outputs directory structure:"
            find android/app/build/outputs -type f || true
            exit 1
          fi

          SIZE_BYTES=$(stat -c%s "$APK_PATH" 2>/dev/null || stat -f%z "$APK_PATH" 2>/dev/null || echo "0")
          SIZE_HUMAN=$(ls -lh "$APK_PATH" | awk '{print $5}')

          if [ "$SIZE_BYTES" -le 0 ]; then
            echo "::error::Generated APK file is empty (0 bytes)!"
            exit 1
          fi

          echo "=========================================="
          echo "SUCCESS: Valid Release APK found!"
          echo "Path: $APK_PATH"
          echo "Size: $SIZE_HUMAN ($SIZE_BYTES bytes)"
          echo "=========================================="

          mkdir -p build-apk
          cp "$APK_PATH" build-apk/app-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build-apk/app-release.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        continue-on-error: true
        with:
          tag_name: android-v${{ github.run_number }}
          name: Due Manager Android Release v${{ github.run_number }}
          body: |
            ## Due Manager Android Application Release
            This release contains the standalone Android APK (`app-release.apk`) for Due Manager.
          files: build-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
